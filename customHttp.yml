customHeaders:
  # Imágenes y audio llevan ?v=<hash> en la URL: se pueden cachear para siempre
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  # JS/CSS de Vite (con hash en el nombre)
  - pattern: '/static/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '/sw.js'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: Cache-Control
        value: 'public, max-age=3600'
      - key: Content-Type
        value: 'application/manifest+json'
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
